version: 2

models:
  - name: int_orders_with_payments
    description: >
      Одна строка — один заказ (включая тестовые), к нему пристыкованы итоги по платежам.
      Платежи сначала свёрнуты до заказа, потом присоединены left join: заказ без платежей не теряется.
    columns:
      - name: order_id
        description: "Номер заказа."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: is_confirmed
        description: "Подтверждённая покупка: статус paid и хотя бы одна успешная оплата."
      - name: success_operations_count
        description: "Число операций в статусе success, включая возвраты."
      - name: failed_operations_count
        description: "Число неуспешных операций."
      - name: pending_operations_count
        description: "Число операций в ожидании."
  
  - name: int_product_categories_tree
    description: >
      Одна строка - одна категория. К категории добавлены родитель,
      корень и глубина. Строится рекурсивным CTE, поэтому не сломается, если появится четвёртый уровень.
    columns:
      - name: category_id
        description: "Номер категории."
        data_tests: [unique, not_null]
      - name: category_name
        description: "Название категории."
      - name: parent_category_id
        description: "Номер родительской категории. Пусто у верхнего уровня."
      - name: parent_category_name
        description: "Название родительской категории. Пусто у верхнего уровня."
      - name: root_category_name
        description: "Категория верхнего уровня, к которой относится эта категория."
        data_tests: [not_null]
      - name: category_level
        description: "Глубина в дереве: 1 — верхний уровень, 2 — подкатегория, 3 — подкатегория подкатегории."

  - name: int_products_with_categories
    description: "Одна строка — один товар. Категория, её родитель и корень."
    columns:
      - name: product_id
        description: "Номер товара."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Категория товара (нижний уровень, к которому он привязан)."
      - name: parent_category_name
        description: "Родительская категория."
      - name: root_category_name
        description: "Категория верхнего уровня: Electronics или Home."
        data_tests: [not_null]
  - name: int_customer_orders
    description: "Подтверждённые покупки по клиенту: одна строка — один клиент с хотя бы одной покупкой."
    columns:
      - name: customer_id
        description: "Номер клиента."
        data_tests: [unique, not_null]


version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ. Ключ на dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: "Дата заказа."
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
      - name: items_count
        description: "Число разных товаров в заказе."
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]
  - name: dim_products
    description: "Измерение товаров: одна строка — один товар. Иерархия категорий от товара до верхнего уровня."
    columns:
      - name: product_id
        description: "Номер товара."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Категория товара — нижний уровень, к которому он привязан."
      - name: parent_category_name
        description: "Родительская категория."
      - name: root_category_name
        description: "Категория верхнего уровня: Electronics или Home."
        data_tests: [not_null]

  - name: dim_dates
    description: "Календарь: одна строка — один день. Все дни от первого до последнего заказа, включая дни без заказов."
    columns:
      - name: date_day
        description: "Дата."
        data_tests: [unique, not_null]
      - name: year
        description: "Год."
      - name: quarter
        description: "Квартал: 1–4."
      - name: month
        description: "Номер месяца: 1–12."
      - name: year_month
        description: "Год и месяц текстом. Удобно для выручки по месяцам."
      - name: day_of_week
        description: "День недели: 1 — понедельник, 7 — воскресенье."
      - name: is_weekend
        description: "Выходной день: суббота или воскресенье."
        data_tests: [not_null]
  
  - name: fct_order_items
    description: "Факт позиций заказа: одна строка — один товар в заказе. Тестовые заказы исключены."
    columns:
      - name: order_item_id
        description: "Ключ позиции вида 101-1: номер заказа и номер товара через дефис."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Заказ, в который входит позиция."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Товар."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Клиент, оформивший заказ. Ключ на dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
      - name: quantity
        description: "Количество штук товара."
        data_tests: [non_negative]
      - name: unit_price
        description: "Цена за штуку в рублях."
        data_tests: [non_negative]
      - name: gross_amount
        description: "Сумма позиции до скидки."
      - name: discount_amount
        description: "Скидка на позицию в рублях."
      - name: line_amount
        description: "Сумма позиции после скидки."
        data_tests: [non_negative]
      - name: is_confirmed
        description: "Подтверждённая покупка: заказ в статусе paid и хотя бы одна успешная оплата."
        data_tests: [not_null]
  
  - name: dim_customers
    description: "Измерение клиентов: одна строка — один клиент, включая тех, кто ничего не купил."
    columns:
      - name: customer_id
        description: "Номер клиента."
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Время регистрации."
      - name: registration_date
        description: "Дата регистрации без времени."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения: откуда пришёл клиент."
      - name: first_confirmed_order_id
        description: "Номер первой подтверждённой покупки. Пусто, если покупок не было."
      - name: first_confirmed_at
        description: "Время первой подтверждённой покупки. Пусто, если покупок не было."
      - name: confirmed_orders_count
        description: "Число подтверждённых покупок; 0, если их нет."
        data_tests: [not_null]
      - name: confirmed_revenue
        description: "Сумма подтверждённых покупок в рублях; 0, если их нет."
        data_tests: [not_null]
      - name: is_buyer
        description: "Есть хотя бы одна подтверждённая покупка."
        data_tests: [not_null]



